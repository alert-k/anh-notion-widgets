<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANH Calendar</title><link rel="stylesheet" href="w.css">
<style>
.bento{grid-template-columns:1.25fr 1fr}
.head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.head h2{margin:0;font:500 22px var(--display);letter-spacing:-.02em}
.head div{display:flex;gap:var(--s2)} .head button{width:34px;padding:0;display:grid;place-items:center;font-size:16px}
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;margin-top:var(--s3)}
th{font:500 10px var(--mono);letter-spacing:.2em;color:var(--faint);padding:0 0 var(--s2);text-align:center}
td{height:40px;text-align:center;vertical-align:top;padding-top:5px;border-top:1px solid var(--line)}
td span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:2px;font-size:13px}
td.t span{background:var(--ac);color:#04140a;font-weight:700}
td .d{display:flex;justify-content:center;gap:3px;margin-top:3px;height:4px}
td .d i{width:4px;height:4px;border-radius:50%}
.up{list-style:none;margin:var(--s3) 0 0;padding:0}
.up li{display:flex;align-items:center;gap:var(--s3);padding:10px 0;border-top:1px solid var(--line)}
.up li:first-child{border-top:0;padding-top:0}
.up b{font:500 11px var(--mono);color:var(--mut);min-width:40px} .up i{width:6px;height:6px;border-radius:50%;flex:none}
.up span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
textarea{width:100%;min-height:96px;margin-top:var(--s3);background:transparent;border:1px solid var(--line);border-radius:var(--r);padding:var(--s3);resize:vertical;font:400 13.5px/1.55 var(--body);color:var(--ink)}
textarea::placeholder{color:var(--faint)} textarea:focus{border-color:var(--ac);outline:0}
.side{display:grid;gap:var(--s2);align-content:start}
@media (max-width:520px){.bento{grid-template-columns:1fr}}
</style></head>
<body><main class="bento">
<section class="tile"><div class="head"><div><span class="lbl">Calendar</span></div><h2 id="ym"></h2>
  <div><button onclick="mv(-1)" aria-label="이전 달">‹</button><button onclick="mv(1)" aria-label="다음 달">›</button></div></div>
<table id="tb" aria-label="월간 캘린더"></table></section>
<div class="side">
  <section class="tile"><div class="lbl">Upcoming</div><ul class="up" id="up"><li class="mut">불러오는 중…</li></ul></section>
  <section class="tile"><div class="lbl">Memo <span style="color:var(--faint)">· this device</span></div><textarea id="memo" aria-label="메모" placeholder="한 줄 메모…"></textarea></section>
</div></main>
<script src="w.js"></script>
<script>
let D = { tasks: [], today: iso(new Date()) }, cur = new Date(); cur.setDate(1);
const QC = q => (q || "").startsWith("Q1") ? "var(--warn)" : (q || "").startsWith("Q2") ? "var(--ac)" : (q || "").startsWith("Q3") ? "var(--amber)" : "var(--faint)";
function draw() {
  const y = cur.getFullYear(), m = cur.getMonth(), by = {};
  D.tasks.forEach(t => (by[t.due.slice(0, 10)] ||= []).push(t));
  ym.textContent = `${y}.${String(m + 1).padStart(2, "0")}`;
  let h = "<tr>" + ["S", "M", "T", "W", "T", "F", "S"].map(s => `<th scope="col">${s}</th>`).join("") + "</tr><tr>";
  const f = new Date(y, m, 1).getDay(), n = new Date(y, m + 1, 0).getDate();
  for (let i = 0; i < f; i++) h += "<td></td>";
  for (let d = 1; d <= n; d++) {
    const s = iso(new Date(y, m, d)); if ((f + d - 1) % 7 === 0 && d > 1) h += "</tr><tr>";
    const dots = (by[s] || []).slice(0, 3).map(t => `<i style="background:${QC(t.q)}"></i>`).join("");
    h += `<td class="${s === D.today ? "t" : ""}"><span>${d}</span><div class="d">${dots}</div></td>`;
  }
  tb.innerHTML = h + "</tr>";
}
const mv = n => { cur.setMonth(cur.getMonth() + n); draw(); };
try { memo.value = localStorage.memo || ""; memo.oninput = () => localStorage.memo = memo.value; } catch (e) {}
load().then(d => {
  D = d; const t = d.today;
  const items = d.tasks.filter(x => x.due.slice(0, 10) >= t).sort((a, b) => a.due < b.due ? -1 : 1).slice(0, 5);
  up.innerHTML = items.map(x => `<li><b>${x.due.slice(5, 10).replace("-", "/")}</b><i style="background:${QC(x.q)}"></i><span>${x.t}</span></li>`).join("") || '<li class="mut">예정된 Task 없음</li>';
  draw();
}).catch(() => { up.innerHTML = '<li class="mut">데이터를 불러오지 못했어요</li>'; draw(); });
</script></body></html>
