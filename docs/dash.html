<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANH Dash</title><link rel="stylesheet" href="w.css">
<style>
.bento{grid-template-columns:1.35fr 1fr 1fr}
.hero{grid-row:span 2;display:flex;flex-direction:column;justify-content:space-between}
.hero .big{font-size:56px}
.ph{display:flex;justify-content:space-between;gap:var(--s2);margin-top:var(--s4);font-size:12.5px}
.ph b{font-weight:600}
.wide{grid-column:1/-1}
.heat{display:grid;grid-template-columns:repeat(28,1fr);gap:3px;margin-top:var(--s3)}
.heat i{aspect-ratio:1;border-radius:1px;background:var(--track)}
.heat i.l1{background:color-mix(in srgb,var(--ac) 35%,var(--track))} .heat i.l2{background:color-mix(in srgb,var(--ac) 65%,var(--track))} .heat i.l3{background:var(--ac)}
.heat i.t{outline:1.5px solid var(--ink);outline-offset:1px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s2);align-items:end;height:64px;margin-top:var(--s3)}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bars i{width:100%;border-radius:1px;background:var(--track);min-height:4px}
.bars i.on{background:var(--ac)} .bars span{font-size:11px;color:var(--mut)}
.split{display:grid;grid-template-columns:1.6fr 1fr;gap:var(--s2)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);flex-wrap:wrap}
@media (max-width:520px){.bento{grid-template-columns:1fr 1fr}.hero{grid-column:1/-1;grid-row:auto}.split{grid-template-columns:1fr}.heat{grid-template-columns:repeat(14,1fr)}}
</style></head>
<body><main class="bento" id="r"><div class="tile wide mut">불러오는 중…</div></main>
<script src="w.js"></script>
<script>
const DAY = "일월화수목금토";
load().then(d => {
  const t = d.roadmap.reduce((a, p) => (a.n += p.total, a.d += p.done, a.e += p.est, a.m += p.min, a), { n: 0, d: 0, e: 0, m: 0 });
  const p = pct(t.d, t.n), cur = d.roadmap.find(x => x.done < x.total) || d.roadmap[d.roadmap.length - 1], cp = pct(cur.done, cur.total);
  const heat = d.routine_hist.map(x => `<i class="${!x.s ? "" : x.s >= 80 ? "l3" : x.s >= 50 ? "l2" : "l1"}${x.d === d.today ? " t" : ""}" title="${x.d} · ${x.s ?? "-"}%"></i>`).join("");
  const mx = Math.max(60, ...d.study_days.map(x => x.m));
  const bars = d.study_days.map(x => `<div title="${x.d} · ${x.m}분"><i class="${x.m ? "on" : ""}" style="height:${Math.max(4, x.m / mx * 44)}px"></i><span>${DAY[new Date(x.d + "T00:00").getDay()]}</span></div>`).join("");
  r.innerHTML = `
  <section class="tile hero" aria-label="TOSS 로드맵 진행도">
    <div><div class="lbl">${ico("book")}Roadmap</div><div class="big">${p}<small>%</small></div>
      <div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>
      <div class="mut" style="margin-top:8px">${t.d} / ${t.n} 유닛 · ${(t.m / 60).toFixed(0)}h / ${t.e}h</div></div>
    <div class="ph"><span class="lbl">Phase</span><b>${cur.phase.replace(/^\d+\s*/, "")} ${cp}%</b></div>
  </section>
  <section class="tile"><div class="lbl">${ico("flame")}Streak</div><div class="big">${d.streak}<small>일</small></div><div class="mut" style="margin-top:8px">최근 28일 ${d.routine_hist.filter(x => x.s >= 50).length}일 달성</div></section>
  <section class="tile"><div class="lbl">${ico("check")}Today</div><div class="big">${d.today_score}<small>%</small></div><div class="bar"><i style="width:${d.today_score}%"></i></div></section>
  <section class="tile wide"><div class="lbl">Routine · 28d</div><div class="heat" role="img" aria-label="최근 28일 루틴 달성">${heat}</div></section>
  <section class="tile wide"><div class="split"><div><div class="lbl">Study · 7d</div><div class="bars" role="img" aria-label="최근 7일 공부 시간">${bars}</div></div>
    <div><div class="lbl">This week</div><div class="big">${(d.study_week_min / 60).toFixed(1)}<small>h</small></div><div class="mut" style="margin-top:8px">열린 Task ${d.tasks_open}</div></div></div></section>
  <div class="wide foot"><span class="mut">${Object.entries(d.apps).map(([k, v]) => k + " " + v).join(" · ") || "지원 현황 없음"}</span>
    <span class="chips"><a class="chip" href="https://horyz.io/" target="_blank" rel="noopener">horyz.io <kbd>h</kbd></a><a class="chip" href="https://lab.horyz.io/" target="_blank" rel="noopener">lab <kbd>l</kbd></a></span></div>`;
}).catch(e => r.innerHTML = `<div class="tile wide mut">데이터를 불러오지 못했어요 (${e.message})</div>`);
</script></body></html>
