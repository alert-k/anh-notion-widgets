name: sync-notion
on:
  schedule: [{cron: "*/30 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python sync.py
        env:
          NOTION: ${{ secrets.NOTION }}
          IDS_JSON: ${{ secrets.IDS_JSON }}
          LAB_SYNC_KEY: ${{ secrets.LAB_SYNC_KEY }}
          GH_USER: ${{ github.repository_owner }}
      - run: |
          git config user.name "anh-sync"; git config user.email "anh-sync@users.noreply.github.com"
          git add docs/data.json && (git diff --cached --quiet || git commit -m "sync data.json" && git push)
