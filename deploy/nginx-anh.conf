# Put inside the lab.horyz.io `server { ... }` block, ABOVE the catch-all proxy location. Replace __WIDGET_PATH__.
location = /__WIDGET_PATH__/data.json {
    alias /var/lib/anh-widgets/data.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "frame-ancestors https://www.notion.so https://app.notion.com https://*.notion.site" always;
}
location ^~ /__WIDGET_PATH__/ {
    alias /opt/anh-notion/docs/;
    index dash.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # allow Notion to embed; no X-Frame-Options here (add_header in a location replaces inherited ones)
    add_header Content-Security-Policy "frame-ancestors https://www.notion.so https://app.notion.com https://*.notion.site" always;
}
